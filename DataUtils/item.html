<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP Item Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Custom scrollbar for better UI aesthetics */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans p-6">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">Mass Item Creator</h1>
                <p class="text-gray-400 text-sm mt-1">Import, create, and manage your game items seamlessly.</p>
            </div>
            <div class="flex flex-wrap gap-3 justify-center">
                <button id="loadLatest" class="bg-sky-600 hover:bg-sky-500 text-white font-medium px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2 cursor-pointer">
                    🔄 Load Latest
                </button>
                <label class="bg-gray-700 hover:bg-gray-600 text-white font-medium px-4 py-2 rounded-lg cursor-pointer transition shadow-md flex items-center gap-2">
                    📂 Import JSON
                    <input type="file" id="importJson" accept=".json" class="hidden">
                </label>
                <button id="exportJson" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2 rounded-lg transition shadow-md flex items-center gap-2 cursor-pointer">
                    💾 Export JSON
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <form id="itemForm" class="lg:col-span-5 bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg space-y-4 max-h-[80vh] overflow-y-auto">
                <h2 class="text-xl font-semibold border-b border-gray-700 pb-2 text-indigo-300">Add New Item</h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Item ID</label>
                        <input type="text" id="itemId" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Type</label>
                        <input type="text" id="itemType" value="structure" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">System Name</label>
                        <input type="text" id="itemName" placeholder="e.g. nycoin" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Full/UI Name</label>
                        <input type="text" id="itemFullName" placeholder="e.g. Nycoin" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Category</label>
                    <input type="text" id="itemCategory" value="nycoin" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Icon URL</label>
                    <input type="url" id="itemIcon" placeholder="https://..." class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Description</label>
                    <textarea id="itemDescription" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500 text-sm"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Tags (Comma Separated)</label>
                        <input type="text" id="itemTags" placeholder="unobtainable, farming" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Release Date</label>
                        <input type="text" id="itemRelease" value="00/00/0000" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="bg-gray-900 p-3 rounded border border-gray-700 space-y-3">
                    <h3 class="text-sm font-bold text-indigo-400 border-b border-gray-700 pb-1">Core Stats</h3>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div>
                            <label class="block text-xs text-gray-400 mb-0.5">Protection</label>
                            <input type="number" step="0.1" id="statProt" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1 text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-0.5">Blast Protection</label>
                            <input type="number" step="0.1" id="statBlast" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1 text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-0.5">Speed Modifier</label>
                            <input type="number" step="0.1" id="statSpeed" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1 text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-0.5">Grow Time</label>
                            <input type="number" id="statGrow" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1 text-white">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="flex items-center gap-2 text-sm text-gray-300 font-medium cursor-pointer">
                        <input type="checkbox" id="includeDamage" class="rounded border-gray-700 text-indigo-600 focus:ring-indigo-500">
                        Include Player Damage Modifiers
                    </label>
                    <div id="damageFields" class="hidden bg-gray-900 p-3 rounded border border-gray-700 grid grid-cols-4 gap-2 text-xs">
                        <div>
                            <label class="block text-gray-400">Head</label>
                            <input type="number" id="dmgHead" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1">
                        </div>
                        <div>
                            <label class="block text-gray-400">Body</label>
                            <input type="number" id="dmgBody" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1">
                        </div>
                        <div>
                            <label class="block text-gray-400">Legs</label>
                            <input type="number" id="dmgLegs" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1">
                        </div>
                        <div>
                            <label class="block text-gray-400">Hands</label>
                            <input type="number" id="dmgHands" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1">
                        </div>
                    </div>

                    <label class="flex items-center gap-2 text-sm text-gray-300 font-medium cursor-pointer">
                        <input type="checkbox" id="includeInv" class="rounded border-gray-700 text-indigo-600 focus:ring-indigo-500">
                        Include Inventory Grid
                    </label>
                    <div id="invFields" class="hidden bg-gray-900 p-3 rounded border border-gray-700 grid grid-cols-3 gap-2 text-xs">
                        <div>
                            <label class="block text-gray-400">Slots</label>
                            <input type="number" id="invSlots" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1">
                        </div>
                        <div>
                            <label class="block text-gray-400">Grid X</label>
                            <input type="number" id="invX" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1">
                        </div>
                        <div>
                            <label class="block text-gray-400">Grid Y</label>
                            <input type="number" id="invY" value="0" class="w-full bg-gray-800 border border-gray-700 rounded p-1">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition shadow-md cursor-pointer">
                    ➕ Add to Live Dataset
                </button>
            </form>

            <div class="lg:col-span-7 bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg flex flex-col max-h-[80vh]">
                <div class="flex justify-between items-center border-b border-gray-700 pb-2 mb-4">
                    <h2 class="text-xl font-semibold text-indigo-300">Active Dataset (<span id="itemCount">0</span> Items)</h2>
                    <button id="clearAll" class="text-xs text-red-400 hover:text-red-300 transition font-medium cursor-pointer">Clear All</button>
                </div>
                
                <div id="itemList" class="grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto pr-1 flex-1 align-top content-start">
                    <div id="emptyState" class="col-span-full text-center text-gray-500 py-12">
                        No items loaded. Import a JSON file, fetch remote data, or add items manually to start building your database.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let itemDataset = [];

        // Toggle sub-stats UI panels
        document.getElementById('includeDamage').addEventListener('change', (e) => {
            document.getElementById('damageFields').classList.toggle('hidden', !e.target.checked);
        });
        document.getElementById('includeInv').addEventListener('change', (e) => {
            document.getElementById('invFields').classList.toggle('hidden', !e.target.checked);
        });

        // Dynamic item UI renderer
        function renderItems() {
            const listContainer = document.getElementById('itemList');
            const emptyState = document.getElementById('emptyState');
            const countBadge = document.getElementById('itemCount');
            
            // Clean up old list items
            const oldCards = listContainer.querySelectorAll('.item-card');
            oldCards.forEach(card => card.remove());

            countBadge.innerText = itemDataset.length;

            if (itemDataset.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');

            itemDataset.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "item-card bg-gray-900 border border-gray-700 rounded-lg p-4 flex gap-3 relative hover:border-gray-500 transition group items-start";
                
                // Safety logic for fallback image icons
                const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='%234b5563'><rect width='24' height='24' rx='4'/></svg>";
                
                // Create tags elements safely
                const tagsHtml = (item.tags || []).map(t => `<span class="bg-gray-800 text-gray-400 text-[10px] px-1.5 py-0.5 rounded border border-gray-700">${t}</span>`).join('');

                card.innerHTML = `
                    <img src="${item.icon || fallbackImg}" onerror="this.src='${fallbackImg}'" class="w-12 h-12 rounded bg-gray-800 object-contain p-1 border border-gray-700 shrink-0">
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-bold text-gray-200 truncate pr-5" title="${item.full_name}">${item.full_name || item.name}</div>
                        <div class="text-xs text-gray-500 font-mono">ID: ${item.id} | Type: ${item.type}</div>
                        <div class="flex flex-wrap gap-1 mt-1.5">${tagsHtml}</div>
                    </div>
                    <button onclick="removeItem(${index})" class="absolute top-2 right-2 text-gray-500 hover:text-red-400 font-bold text-sm transition cursor-pointer px-1">&times;</button>
                `;
                listContainer.appendChild(card);
            });
        }

        // Delete item target
        window.removeItem = function(index) {
            itemDataset.splice(index, 1);
            renderItems();
        }

        // Wipe dataset completely
        document.getElementById('clearAll').addEventListener('click', () => {
            if (confirm("Are you sure you want to clear your current database? Any unsaved work will be lost.")) {
                itemDataset = [];
                renderItems();
            }
        });

        // Form handler to build data structures matching the scheme requested
        document.getElementById('itemForm').addEventListener('submit', (e) => {
            e.preventDefault();

            // Construct structural stats configurations
            const baseStats = {
                protection: parseFloat(document.getElementById('statProt').value) || 0.0,
                blast_protection: parseFloat(document.getElementById('statBlast').value) || 0.0,
                speed: parseFloat(document.getElementById('statSpeed').value) || 0.0,
                grow_time: parseInt(document.getElementById('statGrow').value) || 0
            };

            if (document.getElementById('includeDamage').checked) {
                baseStats.damage = {
                    player: {
                        head: parseInt(document.getElementById('dmgHead').value) || 0,
                        body: parseInt(document.getElementById('dmgBody').value) || 0,
                        legs: parseInt(document.getElementById('dmgLegs').value) || 0,
                        hands: parseInt(document.getElementById('dmgHands').value) || 0
                    }
                };
            }

            if (document.getElementById('includeInv').checked) {
                baseStats.inventory = {
                    slots: parseInt(document.getElementById('invSlots').value) || 0,
                    x: parseInt(document.getElementById('invX').value) || 0,
                    y: parseInt(document.getElementById('invY').value) || 0
                };
            }

            // Map string configuration directly into tags arrays 
            const tagsInput = document.getElementById('itemTags').value;
            const tagsArray = tagsInput ? tagsInput.split(',').map(tag => tag.trim()).filter(t => t.length > 0) : [];

            const newItem = {
                id: document.getElementById('itemId').value,
                name: document.getElementById('itemName').value.trim(),
                full_name: document.getElementById('itemFullName').value.trim(),
                description: document.getElementById('itemDescription').value.trim(),
                icon: document.getElementById('itemIcon').value.trim(),
                catagory: document.getElementById('itemCategory').value.trim(),
                tags: tagsArray,
                release_date: document.getElementById('itemRelease').value,
                type: document.getElementById('itemType').value,
                stats: baseStats
            };

            // Inject object into working dataset structure
            itemDataset.push(newItem);
            renderItems();

            // Reset operational parts of inputs
            document.getElementById('itemId').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemFullName').value = '';
            document.getElementById('itemDescription').value = '';
            document.getElementById('itemIcon').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Native JSON processing mechanisms (Local File Import)
        document.getElementById('importJson').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsedData = JSON.parse(evt.target.result);
                    if (Array.isArray(parsedData)) {
                        itemDataset = [...itemDataset, ...parsedData];
                        renderItems();
                    } else {
                        alert("Invalid JSON format. Expected an array of items.");
                    }
                } catch (err) {
                    alert("Error parsing file. Ensure it is valid JSON.");
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        });

        // Remote Live Fetching Engine (Cache-Busting Enabled)
        document.getElementById('loadLatest').addEventListener('click', async () => {
            const btn = document.getElementById('loadLatest');
            const originalText = btn.innerHTML;
            
            // Visual loading state updates
            btn.innerHTML = "⏳ Fetching...";
            btn.disabled = true;

            // Cache-busting parameter string appended to completely bypass GitHub CDNs/Browser caches
            const remoteUrl = `https://raw.githubusercontent.com/NylexLifeRP/item_images/refs/heads/main/items.json?t=${Date.now()}`;

            try {
                const response = await fetch(remoteUrl, { 
                    method: 'GET',
                    cache: 'no-store', // Forces browser to bypass HTTP caches entirely
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP state code ${response.status}`);
                }

                const remoteData = await response.json();

                if (Array.isArray(remoteData)) {
                    // Appends data directly into the active viewport array
                    itemDataset = [...itemDataset, ...remoteData];
                    renderItems();
                    alert(`Successfully imported ${remoteData.length} fresh items from the repository metadata!`);
                } else {
                    alert("The remote JSON file fetched successfully, but its layout wasn't wrapped as an Array structure.");
                }

            } catch (error) {
                console.error(error);
                alert(`Failed to load network asset: ${error.message}\nMake sure CORS policies allow this access point or the file path is correct.`);
            } finally {
                // Restore button state
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Dynamic System Data Serialization (Export Engine)
        document.getElementById('exportJson').addEventListener('click', () => {
            if (itemDataset.length === 0) {
                alert("Nothing to export yet! Please import files or add entries first.");
                return;
            }
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(itemDataset, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", "items_exported.json");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        });
    </script>
</body>
</html>
