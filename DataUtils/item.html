<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console - Item Registry Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f0f11; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-[#0f0f11] text-[#f4f4f5] min-h-screen flex flex-col antialiased select-none">

    <nav class="bg-[#18181b] border-b border-[#27272a] px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-[#f38020] text-black font-black p-1.5 rounded text-xs uppercase tracking-wider">Console</div>
            <h1 class="text-sm font-semibold tracking-wide text-[#f4f4f5]">Nylex RP / Data Management Matrix</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="loadLatest" class="bg-[#27272a] hover:bg-[#3f3f46] text-[#f4f4f5] text-xs font-medium px-3 py-1.5 rounded transition border border-[#3f3f46] flex items-center gap-1.5 cursor-pointer">
                🔄 Load Latest
            </button>
            <label class="bg-[#27272a] hover:bg-[#3f3f46] text-[#f4f4f5] text-xs font-medium px-3 py-1.5 rounded transition border border-[#3f3f46] flex items-center gap-1.5 cursor-pointer">
                📂 Import JSON
                <input type="file" id="importJson" accept=".json" class="hidden">
            </label>
            <button id="exportJson" class="bg-[#f38020] hover:bg-[#fa923e] text-black text-xs font-bold px-3 py-1.5 rounded transition flex items-center gap-1.5 cursor-pointer">
                💾 Export JSON
            </button>
        </div>
    </nav>

    <main class="flex-1 max-w-[1650px] w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 h-[calc(100vh-4rem)] overflow-hidden">
        
        <form id="itemForm" class="lg:col-span-5 bg-[#18181b] border border-[#27272a] rounded-lg p-5 flex flex-col h-full space-y-4 overflow-y-auto shadow-xl">
            <div class="flex justify-between items-center border-b border-[#27272a] pb-3 shrink-0">
                <h2 id="formTitle" class="text-sm font-semibold text-[#f4f4f5] uppercase tracking-wider">Create Profile</h2>
                <button type="button" id="cancelEditBtn" class="hidden text-xs bg-[#27272a] hover:bg-[#3f3f46] text-[#a1a1aa] px-2 py-1 rounded border border-[#3f3f46] cursor-pointer">Cancel Route</button>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Item ID</label>
                    <input type="text" id="itemId" required class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Item Type</label>
                    <input type="text" id="itemType" required class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">System Name</label>
                    <input type="text" id="itemName" required class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Full / UI Display Name</label>
                    <input type="text" id="itemFullName" required class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Category Grouping</label>
                    <input type="text" id="itemCategory" required class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Release Protocol Date</label>
                    <input type="text" id="itemRelease" class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Asset Link (Icon URL)</label>
                <input type="url" id="itemIcon" class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-xs text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
            </div>

            <div>
                <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Summary Description</label>
                <textarea id="itemDescription" rows="2" class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020] resize-none"></textarea>
            </div>

            <div>
                <label class="block text-[11px] font-medium text-[#a1a1aa] mb-1">Global Tags (Comma Delimited)</label>
                <input type="text" id="itemTags" class="w-full bg-[#0f0f11] border border-[#27272a] rounded p-2 text-sm text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
            </div>

            <div class="bg-[#0f0f11] p-3 rounded border border-[#27272a] grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">System Buy Price</label>
                    <input type="number" id="buyPrice" value="-1" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1.5 text-sm font-mono text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-[#a1a1aa] uppercase tracking-wider mb-1">System Sell Price</label>
                    <input type="number" id="sellPrice" value="-1" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1.5 text-sm font-mono text-[#f4f4f5] focus:outline-none focus:border-[#f38020]">
                </div>
            </div>

            <div class="space-y-3 border-t border-[#27272a] pt-4 select-text">
                
                <div class="space-y-2">
                    <label class="flex items-center gap-2.5 text-xs text-[#e4e4e7] font-medium cursor-pointer select-none">
                        <input type="checkbox" id="includeCore" class="rounded border-[#3f3f46] bg-[#0f0f11] text-[#f38020] focus:ring-0 focus:ring-offset-0">
                        Include Core & Ballistic Attributes
                    </label>
                    <div id="coreFields" class="hidden bg-[#0f0f11] p-3 rounded border border-[#27272a] grid grid-cols-3 gap-3 text-xs">
                        <div>
                            <label class="block text-[#a1a1aa] mb-1">Protection</label>
                            <input type="number" step="0.1" id="statProt" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                        <div>
                            <label class="block text-[#a1a1aa] mb-1">Blast Prot.</label>
                            <input type="number" step="0.1" id="statBlast" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                        <div>
                            <label class="block text-[#a1a1aa] mb-1">Speed Mod.</label>
                            <input type="number" step="0.1" id="statSpeed" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                        <div>
                            <label class="block text-[#a1a1aa] mb-1">Range (m)</label>
                            <input type="number" step="0.1" id="statRange" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                        <div>
                            <label class="block text-[#a1a1aa] mb-1">Base DPS</label>
                            <input type="number" id="statDps" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                        <div>
                            <label class="block text-[#a1a1aa] mb-1">Rounds / Sec</label>
                            <input type="number" step="0.1" id="statFireRate" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="flex items-center gap-2.5 text-xs text-[#e4e4e7] font-medium cursor-pointer select-none">
                        <input type="checkbox" id="includeFarming" class="rounded border-[#3f3f46] bg-[#0f0f11] text-[#f38020] focus:ring-0 focus:ring-offset-0">
                        Include Cultivation & Farming Node
                    </label>
                    <div id="farmingFields" class="hidden bg-[#0f0f11] p-3 rounded border border-[#27272a] space-y-3 text-xs">
                        <div>
                            <label class="block text-[#a1a1aa] mb-1">Growth Duration Metric (Seconds)</label>
                            <input type="number" id="farmGrow" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 font-mono text-[#f4f4f5]">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[#a1a1aa] mb-1">Harvest Drop Yield Node</label>
                                <input type="text" id="farmYield" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                            </div>
                            <div>
                                <label class="block text-[#a1a1aa] mb-1">Extraction Source Origin</label>
                                <input type="text" id="farmSource" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="flex items-center gap-2.5 text-xs text-[#e4e4e7] font-medium cursor-pointer select-none">
                        <input type="checkbox" id="includeDamage" class="rounded border-[#3f3f46] bg-[#0f0f11] text-[#f38020] focus:ring-0 focus:ring-offset-0">
                        Include Multi-Target Damage Modules
                    </label>
                    <div id="damageFields" class="hidden bg-[#0f0f11] p-3 rounded border border-[#27272a] space-y-3 text-xs">
                        <div>
                            <div class="text-[10px] font-semibold text-[#f38020] uppercase tracking-wider mb-1.5">Player Sub-Anatomy</div>
                            <div class="grid grid-cols-4 gap-2">
                                <div>
                                    <label class="block text-[#a1a1aa] text-[9px] mb-0.5">Cranium</label>
                                    <input type="number" id="dmgHead" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                                </div>
                                <div>
                                    <label class="block text-[#a1a1aa] text-[9px] mb-0.5">Torso</label>
                                    <input type="number" id="dmgBody" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                                </div>
                                <div>
                                    <label class="block text-[#a1a1aa] text-[9px] mb-0.5">Legs</label>
                                    <input type="number" id="dmgLegs" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                                </div>
                                <div>
                                    <label class="block text-[#a1a1aa] text-[9px] mb-0.5">Hands</label>
                                    <input type="number" id="dmgHands" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                                </div>
                            </div>
                        </div>
                        <div>
                            <div class="text-[10px] font-semibold text-[#f38020] uppercase tracking-wider mb-1.5">External Target Profiles</div>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="block text-[#a1a1aa] text-[9px] mb-0.5">Animal Damage</label>
                                    <input type="number" id="dmgAnimal" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                                </div>
                                <div>
                                    <label class="block text-[#a1a1aa] text-[9px] mb-0.5">Zombie Damage</label>
                                    <input type="number" id="dmgZombie" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                                </div>
                                <div>
                                    <label class="block text-[#a1a1aa] text-[9px] mb-0.5">Structure Dmg</label>
                                    <input type="number" id="dmgStructure" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="flex items-center gap-2.5 text-xs text-[#e4e4e7] font-medium cursor-pointer select-none">
                        <input type="checkbox" id="includeInv" class="rounded border-[#3f3f46] bg-[#0f0f11] text-[#f38020] focus:ring-0 focus:ring-offset-0">
                        Include Clothing / Spatial Container Capacity
                    </label>
                    <div id="invFields" class="hidden bg-[#0f0f11] p-3 rounded border border-[#27272a] grid grid-cols-3 gap-2 text-xs">
                        <div>
                            <label class="block text-[#a1a1aa] mb-0.5">Total Allocation</label>
                            <input type="number" id="invSlots" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                        <div>
                            <label class="block text-[#a1a1aa] mb-0.5">Matrix Dim X</label>
                            <input type="number" id="invX" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                        <div>
                            <label class="block text-[#a1a1aa] mb-0.5">Matrix Dim Y</label>
                            <input type="number" id="invY" value="0" class="w-full bg-[#18181b] border border-[#27272a] rounded p-1 text-[#f4f4f5]">
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-2 mt-auto shrink-0 select-none">
                <button type="submit" id="submitFormBtn" class="w-full bg-[#f38020] hover:bg-[#fa923e] text-black font-bold py-2 rounded transition shadow text-xs uppercase tracking-wider cursor-pointer">
                    Commit Entry to Dataset
                </button>
            </div>
        </form>

        <div class="lg:col-span-7 bg-[#18181b] border border-[#27272a] rounded-lg p-5 flex flex-col h-full shadow-xl overflow-hidden">
            
            <div class="shrink-0 space-y-4 border-b border-[#27272a] pb-4 mb-4">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[#f38020] animate-pulse"></span>
                        <h2 class="text-xs font-semibold text-[#f4f4f5] uppercase tracking-wider">
                            Active System Indexes (<span id="itemCount">0</span>)
                        </h2>
                    </div>
                    <button id="clearAll" class="text-xs text-[#a1a1aa] hover:text-[#f4f4f5] transition cursor-pointer font-medium">Purge All Matrices</button>
                </div>
                
                <div class="relative select-text">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-[#52525b] text-xs">🔍</span>
                    <input type="text" id="searchBar" class="w-full bg-[#0f0f11] border border-[#27272a] rounded pl-9 pr-4 py-2 text-xs text-[#f4f4f5] focus:outline-none focus:border-[#f38020] font-mono" placeholder="Filter indexes based on dynamic target ID, descriptive properties, tags...">
                </div>
            </div>
            
            <div id="itemList" class="grid grid-cols-1 xl:grid-cols-2 gap-3 overflow-y-auto pr-1 flex-1 align-top content-start select-text">
                <div id="emptyState" class="col-span-full text-center text-[#52525b] py-24 text-xs font-mono select-none">
                    No runtime items map within active cache memory arrays. Pull system files or create profiles to map nodes.
                </div>
            </div>
        </div>

    </main>

    <script>
        let itemDataset = [];
        let editingIndex = null;

        // Configuration Module Visibility Layout Toggles
        const activeToggles = [
            { check: 'includeCore', target: 'coreFields' },
            { check: 'includeFarming', target: 'farmingFields' },
            { check: 'includeDamage', target: 'damageFields' },
            { check: 'includeInv', target: 'invFields' }
        ];
        activeToggles.forEach(toggle => {
            document.getElementById(toggle.check).addEventListener('change', (e) => {
                document.getElementById(toggle.target).classList.toggle('hidden', !e.target.checked);
            });
        });

        // Search Scanner Event Hook
        document.getElementById('searchBar').addEventListener('input', () => renderItems());

        // Reset Interface Configuration Matrices Cleanly
        function resetFormState() {
            editingIndex = null;
            document.getElementById('itemForm').reset();
            document.getElementById('formTitle').innerText = "Create Profile";
            document.getElementById('submitFormBtn').className = "w-full bg-[#f38020] hover:bg-[#fa923e] text-black font-bold py-2 rounded transition shadow text-xs uppercase tracking-wider cursor-pointer";
            document.getElementById('submitFormBtn').innerText = "Commit Entry to Dataset";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            
            activeToggles.forEach(toggle => document.getElementById(toggle.target).classList.add('hidden'));
            
            document.getElementById('buyPrice').value = "-1";
            document.getElementById('sellPrice').value = "-1";
            
            document.querySelectorAll('.item-card').forEach(card => card.classList.remove('border-[#f38020]', 'bg-[#27272a]/20'));
        }

        document.getElementById('cancelEditBtn').addEventListener('click', () => resetFormState());

        // Virtual Element Layout Array Matrix Renderer
        function renderItems() {
            const container = document.getElementById('itemList');
            const placeholder = document.getElementById('emptyState');
            const trackerBadge = document.getElementById('itemCount');
            const filterQuery = document.getElementById('searchBar').value.toLowerCase().trim();
            
            container.querySelectorAll('.item-card').forEach(card => card.remove());
            trackerBadge.innerText = itemDataset.length;

            if (itemDataset.length === 0) {
                placeholder.classList.remove('hidden');
                return;
            }

            const activeViewNodes = itemDataset.map((item, originalIndex) => ({ item, originalIndex })).filter(({ item }) => {
                if (!filterQuery) return true;
                return [
                    item.id, item.name, item.full_name, item.description, 
                    item.catagory, item.type, (item.tags || []).join(' ')
                ].join(' ').toLowerCase().includes(filterQuery);
            });

            if (activeViewNodes.length === 0) {
                placeholder.classList.remove('hidden');
                return;
            }
            
            placeholder.classList.add('hidden');

            activeViewNodes.forEach(({ item, originalIndex }) => {
                const nodeCard = document.createElement('div');
                const stateSyncActive = editingIndex === originalIndex;
                
                nodeCard.className = `item-card bg-[#18181b] border ${stateSyncActive ? 'border-[#f38020] bg-[#27272a]/20' : 'border-[#27272a]'} rounded p-3 flex gap-3 relative hover:border-[#3f3f46] transition items-start cursor-pointer group`;
                nodeCard.setAttribute('data-index', originalIndex);
                
                const missingAssetVector = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' fill='%2327272a'><rect width='24' height='24' rx='2'/></svg>";
                const markupTags = (item.tags || []).map(tag => `<span class="bg-[#0f0f11] text-[#a1a1aa] text-[9px] px-1 rounded border border-[#27272a] font-mono">${tag}</span>`).join('');

                nodeCard.innerHTML = `
                    <img src="${item.icon || missingAssetVector}" onerror="this.src='${missingAssetVector}'" class="w-10 h-10 rounded bg-[#0f0f11] object-contain p-1 border border-[#27272a] shrink-0">
                    <div class="flex-1 min-w-0 pointer-events-none">
                        <div class="text-xs font-semibold text-[#f4f4f5] truncate pr-4">${item.full_name || item.name || 'Undefined Index'}</div>
                        <div class="text-[10px] text-[#52525b] font-mono mt-0.5 truncate">ID: ${item.id || 'Null'}</div>
                        <div class="text-[10px] text-[#a1a1aa] font-mono mt-1">B: ${item.buy_price ?? -1} / S: ${item.sell_price ?? -1}</div>
                        <div class="flex flex-wrap gap-1 mt-2">${markupTags}</div>
                    </div>
                    <button data-delete="${originalIndex}" class="absolute top-1.5 right-1.5 text-[#52525b] hover:text-red-400 font-bold text-sm transition px-1 z-10 cursor-pointer select-none group-hover:text-[#a1a1aa]">&times;</button>
                `;

                nodeCard.addEventListener('click', (e) => {
                    if (e.target.hasAttribute('data-delete')) {
                        e.stopPropagation();
                        removeItem(parseInt(e.target.getAttribute('data-delete')));
                        return;
                    }
                    loadTargetToConsole(originalIndex);
                });

                container.appendChild(nodeCard);
            });
        }

        // Deep Copy Element Context Map Loader
        function loadTargetToConsole(index) {
            resetFormState();
            editingIndex = index;
            const record = itemDataset[index];

            document.getElementById('formTitle').innerText = `Modify Node [${record.id}]`;
            document.getElementById('submitFormBtn').className = "w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded transition shadow text-xs uppercase tracking-wider cursor-pointer";
            document.getElementById('submitFormBtn').innerText = "Update Registered Node";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            document.getElementById('itemId').value = record.id || '';
            document.getElementById('itemType').value = record.type || '';
            document.getElementById('itemName').value = record.name || '';
            document.getElementById('itemFullName').value = record.full_name || '';
            document.getElementById('itemCategory').value = record.catagory || '';
            document.getElementById('itemRelease').value = record.release_date || '';
            document.getElementById('itemIcon').value = record.icon || '';
            document.getElementById('itemDescription').value = record.description || '';
            document.getElementById('itemTags').value = (record.tags || []).join(', ');
            document.getElementById('buyPrice').value = record.buy_price ?? -1;
            document.getElementById('sellPrice').value = record.sell_price ?? -1;

            const statsBlock = record.stats || {};

            // Restore Combat & Core Fields Map
            if ('protection' in statsBlock || 'blast_protection' in statsBlock || 'speed' in statsBlock || 'range' in statsBlock || 'dps' in statsBlock || 'fire_rate' in statsBlock) {
                document.getElementById('includeCore').checked = true;
                document.getElementById('coreFields').classList.remove('hidden');
                document.getElementById('statProt').value = statsBlock.protection ?? 0;
                document.getElementById('statBlast').value = statsBlock.blast_protection ?? 0;
                document.getElementById('statSpeed').value = statsBlock.speed ?? 0;
                document.getElementById('statRange').value = statsBlock.range ?? 0;
                document.getElementById('statDps').value = statsBlock.dps ?? 0;
                document.getElementById('statFireRate').value = statsBlock.fire_rate ?? 0;
            }

            // Restore Agricultural Cultivation Configs
            if ('grow_time' in statsBlock || 'harvest_yield' in statsBlock || 'obtained_from' in statsBlock) {
                document.getElementById('includeFarming').checked = true;
                document.getElementById('farmingFields').classList.remove('hidden');
                document.getElementById('farmGrow').value = statsBlock.grow_time ?? 0;
                document.getElementById('farmYield').value = statsBlock.harvest_yield || '';
                document.getElementById('farmSource').value = statsBlock.obtained_from || '';
            }

            // Restore Expanded Target Damage Config Matrix Nodes
            if (statsBlock.damage) {
                document.getElementById('includeDamage').checked = true;
                document.getElementById('damageFields').classList.remove('hidden');
                
                if (statsBlock.damage.player) {
                    const targetPlayer = statsBlock.damage.player;
                    document.getElementById('dmgHead').value = targetPlayer.head ?? 0;
                    document.getElementById('dmgBody').value = targetPlayer.body ?? 0;
                    document.getElementById('dmgLegs').value = targetPlayer.legs ?? 0;
                    document.getElementById('dmgHands').value = targetPlayer.hands ?? 0;
                }
                document.getElementById('dmgAnimal').value = statsBlock.damage.animal ?? 0;
                document.getElementById('dmgZombie').value = statsBlock.damage.zombie ?? 0;
                document.getElementById('dmgStructure').value = statsBlock.damage.structures ?? 0;
            }

            // Restore Internal Storage Area Matrices
            if (statsBlock.inventory) {
                document.getElementById('includeInv').checked = true;
                document.getElementById('invFields').classList.remove('hidden');
                document.getElementById('invSlots').value = statsBlock.inventory.slots ?? 0;
                document.getElementById('invX').value = statsBlock.inventory.x ?? 0;
                document.getElementById('invY').value = statsBlock.inventory.y ?? 0;
            }

            renderItems();
        }

        function removeItem(index) {
            if (editingIndex === index) resetFormState();
            itemDataset.splice(index, 1);
            renderItems();
        }

        document.getElementById('clearAll').addEventListener('click', () => {
            if (confirm("Purge current live profile cache arrays entirely?")) {
                itemDataset = [];
                resetFormState();
                renderItems();
            }
        });

        // Serialization Package Builder Compiler
        document.getElementById('itemForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const compiledStats = {};

            if (document.getElementById('includeCore').checked) {
                compiledStats.protection = parseFloat(document.getElementById('statProt').value) || 0.0;
                compiledStats.blast_protection = parseFloat(document.getElementById('statBlast').value) || 0.0;
                compiledStats.speed = parseFloat(document.getElementById('statSpeed').value) || 0.0;
                compiledStats.range = parseFloat(document.getElementById('statRange').value) || 0.0;
                compiledStats.dps = parseInt(document.getElementById('statDps').value) || 0;
                compiledStats.fire_rate = parseFloat(document.getElementById('statFireRate').value) || 0.0;
            }

            if (document.getElementById('includeFarming').checked) {
                compiledStats.grow_time = parseInt(document.getElementById('farmGrow').value) || 0;
                compiledStats.harvest_yield = document.getElementById('farmYield').value.trim();
                compiledStats.obtained_from = document.getElementById('farmSource').value.trim();
            }

            if (document.getElementById('includeDamage').checked) {
                compiledStats.damage = {
                    player: {
                        head: parseInt(document.getElementById('dmgHead').value) || 0,
                        body: parseInt(document.getElementById('dmgBody').value) || 0,
                        legs: parseInt(document.getElementById('dmgLegs').value) || 0,
                        hands: parseInt(document.getElementById('dmgHands').value) || 0
                    },
                    animal: parseInt(document.getElementById('dmgAnimal').value) || 0,
                    zombie: parseInt(document.getElementById('dmgZombie').value) || 0,
                    structures: parseInt(document.getElementById('dmgStructure').value) || 0
                };
            }

            if (document.getElementById('includeInv').checked) {
                compiledStats.inventory = {
                    slots: parseInt(document.getElementById('invSlots').value) || 0,
                    x: parseInt(document.getElementById('invX').value) || 0,
                    y: parseInt(document.getElementById('invY').value) || 0
                };
            }

            const unprocessedTags = document.getElementById('itemTags').value;
            const parsedTags = unprocessedTags ? unprocessedTags.split(',').map(tag => tag.trim()).filter(t => t.length > 0) : [];

            const operationalPayload = {
                id: document.getElementById('itemId').value.trim(),
                name: document.getElementById('itemName').value.trim(),
                full_name: document.getElementById('itemFullName').value.trim(),
                description: document.getElementById('itemDescription').value.trim(),
                icon: document.getElementById('itemIcon').value.trim(),
                catagory: document.getElementById('itemCategory').value.trim(),
                tags: parsedTags,
                release_date: document.getElementById('itemRelease').value.trim() || "00/00/0000",
                type: document.getElementById('itemType').value.trim(),
                buy_price: parseInt(document.getElementById('buyPrice').value) ?? -1,
                sell_price: parseInt(document.getElementById('sellPrice').value) ?? -1,
                stats: Object.keys(compiledStats).length > 0 ? compiledStats : {}
            };

            if (editingIndex !== null) {
                itemDataset[editingIndex] = operationalPayload;
            } else {
                itemDataset.push(operationalPayload);
            }

            resetFormState();
            renderItems();
        });

        // Local Storage File System Core Stream Reader
        document.getElementById('importJson').addEventListener('change', (e) => {
            const rawTargetFile = e.target.files[0];
            if (!rawTargetFile) return;

            const trackingReader = new FileReader();
            trackingReader.onload = function(evt) {
                try {
                    const decodedArrayStructure = JSON.parse(evt.target.result);
                    if (Array.isArray(decodedArrayStructure)) {
                        itemDataset = [...itemDataset, ...decodedArrayStructure];
                        renderItems();
                    } else {
                        alert("Malformed internal profile format. Top level must represent array data arrays.");
                    }
                } catch (err) {
                    alert("Syntax checking engine failed to properly process raw JSON characters.");
                }
                e.target.value = '';
            };
            trackingReader.readAsText(rawTargetFile);
        });

        // Safe Micro-Streaming Preflight Bypassing Network Request Engine
        document.getElementById('loadLatest').addEventListener('click', async () => {
            const activationBtn = document.getElementById('loadLatest');
            const placeholderFallbackText = activationBtn.innerHTML;
            
            activationBtn.innerHTML = "⏳ Connecting Vector Stream...";
            activationBtn.disabled = true;

            // Appending runtime ticks directly to URL prevents client browser proxy cache storage without causing CORS preflights
            const targetSourceUri = `https://raw.githubusercontent.com/NylexLifeRP/item_images/refs/heads/main/items.json?nocache=${Date.now()}`;

            try {
                // Stripped down request footprint avoids matching 403 authorization rules
                const cloudstreamResponse = await fetch(targetSourceUri);
                if (!cloudstreamResponse.ok) throw new Error(`Server returned HTTP state code: ${cloudstreamResponse.status}`);
                
                const responsePayloadArray = await cloudstreamResponse.json();

                if (Array.isArray(responsePayloadArray)) {
                    itemDataset = [...itemDataset, ...responsePayloadArray];
                    renderItems();
                } else {
                    alert("Mapping mismatch Exception: Input signature didn't decode to systemic Node Collection Array.");
                }
            } catch (error) {
                console.error(error);
                alert(`Matrix pipeline synchronization block failure: ${error.message}`);
            } finally {
                activationBtn.innerHTML = placeholderFallbackText;
                activationBtn.disabled = false;
            }
        });

        // Direct File Exporter System Serialization Writer
        document.getElementById('exportJson').addEventListener('click', () => {
            if (itemDataset.length === 0) {
                alert("Runtime workspace arrays contain no active profiles to compile.");
                return;
            }
            
            const internalDataUriString = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(itemDataset, null, 2));
            const browserVirtualAnchor = document.createElement('a');
            browserVirtualAnchor.setAttribute("href", internalDataUriString);
            browserVirtualAnchor.setAttribute("download", "items.json");
            document.body.appendChild(browserVirtualAnchor);
            browserVirtualAnchor.click();
            browserVirtualAnchor.remove();
        });
    </script>
</body>
</html>
